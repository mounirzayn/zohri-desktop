<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Zohri IPTV</title>
<style>
  html,body{margin:0;height:100%;background:#05060F;color:#F3F4FA;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  h1{margin:0;font-size:30px}h1 span{color:#8B5CFF}p{margin:0;color:#B9C0DA;max-width:440px}
  button{margin-top:8px;border:0;border-radius:24px;padding:14px 28px;font-weight:700;font-size:16px;background:#2EE6FF;color:#05060F;cursor:pointer}
</style></head>
<body><main>
  <h1>Zohri<span>.</span></h1>
  <p id="m">Pas de connexion au serveur Zohri. Vérifie ta connexion internet.</p>
  <button id="b">Réessayer</button>
</main>
<script>
  const url = new URLSearchParams(location.search).get('url');
  const lang = (navigator.language || 'fr').slice(0, 2);
  if (lang !== 'fr') { document.getElementById('m').textContent = 'Cannot reach the Zohri server. Check your internet connection.'; document.getElementById('b').textContent = 'Try again'; }
  document.getElementById('b').onclick = () => { if (url) location.href = url; };
  setTimeout(() => { if (url && navigator.onLine) location.href = url; }, 15000);
</script>
</body></html>
